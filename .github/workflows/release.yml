name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: ./scripts/build.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
